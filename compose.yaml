services:
  kopfwetter-app:
    build: .
    container_name: kopfwetter-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    # Nur lokal erreichbar; nach außen über Cloudflare Tunnel (oder Reverse Proxy mit TLS)
    ports:
      - "127.0.0.1:8085:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
